```html
<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8">
<title>SOŠ Varnsdorf - Úkoly</title>

<style>

body{
margin:0;
font-family:Arial, sans-serif;
background:linear-gradient(135deg,#e0f7fa,#80deea);
}

/* HEADER */
header{
background:linear-gradient(90deg,#00796b,#004d40);
color:white;
text-align:center;
padding:40px;
}

/* MENU */
nav{
background:#00695c;
padding:15px;
text-align:center;
}

nav a{
color:white;
margin:0 15px;
text-decoration:none;
font-weight:bold;
}

/* SECTIONS */
section{
background:white;
max-width:900px;
margin:30px auto;
padding:25px;
border-radius:10px;
box-shadow:0 5px 15px rgba(0,0,0,0.2);
}

/* TODO LIST */
ul{
list-style:none;
padding:0;
}

li{
padding:10px;
border-bottom:1px solid #ddd;
display:flex;
justify-content:space-between;
}

.done{
text-decoration:line-through;
color:gray;
}

button{
background:#00796b;
color:white;
border:none;
padding:5px 10px;
border-radius:5px;
cursor:pointer;
}

button:hover{
background:#004d40;
}

footer{
background:#004d40;
color:white;
text-align:center;
padding:20px;
}

</style>
</head>

<body>

<header>
<h1>Střední odborná škola Varnsdorf</h1>
<p>Seznam školních úkolů</p>
</header>

<section>
<h2>Automaticky vytvořené úkoly</h2>

<ul id="taskList"></ul>

</section>

<footer>
<p>© 2026 Demo stránka</p>
</footer>

<script>

const tasks = [
"Dokončit domácí úkol z matematiky",
"Připravit prezentaci z IT",
"Napsat referát z češtiny",
"Procvičit programování",
"Přečíst kapitolu z učebnice"
];

const list = document.getElementById("taskList");

tasks.forEach(task => {

let li = document.createElement("li");
li.textContent = task;

let btn = document.createElement("button");
btn.textContent = "Hotovo";

btn.onclick = function(){
li.classList.toggle("done");
}

li.appendChild(btn);

list.appendChild(li);

});

</script>

</body>
</html>
