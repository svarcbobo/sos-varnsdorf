```html
<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8">
<title>SOŠ Varnsdorf - Studentský web</title>

<style>

body{
margin:0;
font-family:Arial, sans-serif;
background:linear-gradient(135deg,#e0f7fa,#80deea);
}

/* HEADER */
header{
background:linear-gradient(90deg,#00796b,#004d40);
color:white;
text-align:center;
padding:40px;
}

/* MENU */
nav{
background:#00695c;
padding:15px;
text-align:center;
}

nav a{
color:white;
margin:0 15px;
text-decoration:none;
font-weight:bold;
}

nav a:hover{
color:yellow;
}

/* SECTIONS */
section{
background:white;
max-width:900px;
margin:30px auto;
padding:25px;
border-radius:10px;
box-shadow:0 5px 15px rgba(0,0,0,0.2);
}

/* FORM */
form{
max-width:500px;
margin:auto;
}

input, textarea{
width:100%;
padding:10px;
margin-top:5px;
margin-bottom:15px;
border-radius:5px;
border:1px solid #ccc;
}

button{
background:#00796b;
color:white;
border:none;
padding:10px 20px;
border-radius:6px;
cursor:pointer;
}

button:hover{
background:#004d40;
}

/* TODO LIST */
#taskInput{
width:70%;
padding:10px;
}

#taskList li{
padding:8px;
border-bottom:1px solid #ddd;
display:flex;
justify-content:space-between;
}

.deleteBtn{
background:red;
padding:5px 10px;
border:none;
color:white;
cursor:pointer;
border-radius:5px;
}

.deleteBtn:hover{
background:darkred;
}

footer{
background:#004d40;
color:white;
text-align:center;
padding:20px;
}

</style>
</head>

<body>

<header>
<h1>Střední odborná škola Varnsdorf</h1>
<p>Studentský demo web</p>
</header>

<nav>
<a href="#about">O škole</a>
<a href="#tasks">Úkoly</a>
<a href="#formular">Kontakt</a>
</nav>

<section id="about">
<h2>O škole</h2>
<p>
Tento web je studentský projekt vytvořený pro ukázku HTML, CSS a JavaScriptu.
</p>
</section>

<section id="tasks">
<h2>Seznam úkolů</h2>

<input id="taskInput" type="text" placeholder="Napiš nový úkol">
<button onclick="addTask()">Přidat</button>

<ul id="taskList"></ul>

</section>

<section id="formular">
<h2>Napiš nám</h2>

<form>
<label>Jméno</label>
<input type="text" placeholder="Tvoje jméno">

<label>Email</label>
<input type="email" placeholder="tvuj@email.cz">

<label>Zpráva</label>
<textarea rows="5" placeholder="Napiš zprávu"></textarea>

<button type="submit">Odeslat</button>
</form>

</section>

<footer>
<p>© 2026 SOŠ Varnsdorf - Demo stránka</p>
</footer>

<script>

function addTask(){
let input=document.getElementById("taskInput");
let task=input.value;

if(task==="") return;

let li=document.createElement("li");
li.textContent=task;

let del=document.createElement("button");
del.textContent="X";
del.className="deleteBtn";

del.onclick=function(){
li.remove();
};

li.appendChild(del);

document.getElementById("taskList").appendChild(li);

input.value="";
}

</script>

</body>
</html>
